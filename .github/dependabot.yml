version: 2
updates:
  # Keep npm dependencies patched (security + freshness).
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(dev-deps)'
    # Group only non-breaking dev-dep updates; majors open as separate PRs to vet one at a time.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    # Keep @types/node aligned with the Node support floor (engines >=20);
    # newer majors describe APIs we don't target.
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'

  # Keep the pinned GitHub Actions SHAs up to date.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'
